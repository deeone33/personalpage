<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Start page</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<div id="wall"></div>
<aside id="dock" hidden aria-label="Docked players"></aside>
<div id="dockGrip" title="Drag to resize the players"></div>
<main id="app">
  <header>
    <div><div id="day">Day</div><div id="date" class="mut">Date</div></div>
  </header>
  <div id="clocks"></div>
  <div id="grid"></div>
  <footer class="mut">Start page · version <span id="ver"></span> · weather, Twitch and stock prices are live once connected; other tiles are sample data<span id="who"></span></footer>
</main>
<aside id="panel" hidden>
  <div class="ph"><b>Settings</b><button id="closeBtn">Close</button></div>
  <div class="acct">
    <b>Gmail accounts</b>
    <input type="text" id="mn0" placeholder="Name, e.g. Personal">
    <input type="text" id="mu0" placeholder="Script address (ends in /exec)">
    <input type="text" id="mt0" placeholder="Token">
    <input type="text" id="mn1" placeholder="Name, e.g. Work">
    <input type="text" id="mu1" placeholder="Script address (ends in /exec)">
    <input type="text" id="mt1" placeholder="Token">
    <button id="mailSave">Save Gmail accounts</button>
    <div id="mailMsg" class="mut" role="status"></div>
  </div>
  <div class="acct">
    <b>News sources</b>
    <div id="srcNews"></div>
    <form id="addNews" class="add"><input type="text" id="newsName" placeholder="Name (optional)"><input type="text" id="newsUrl" placeholder="Feed address or website"><button>Add</button></form>
    <b>Telegram channels</b>
    <div id="srcTg"></div>
    <form id="addTg" class="add"><input type="text" id="tgIn" placeholder="Channel name or t.me link"><button>Add</button></form>
    <button id="srcReset">Back to default sources</button>
    <div id="srcMsg" class="mut" role="status"></div>
  </div>
  <label>Theme <button id="themeBtn"></button></label>
  <label>Accent color <span><input type="color" id="accent"> <button id="accentReset">Reset</button></span></label>
  <div class="acct">
    <b>Colors</b>
    <label>Background <input type="color" id="cBg"></label>
    <label>Boxes <input type="color" id="cCard"></label>
    <label>Text size <input type="range" id="fsAll" min="70" max="140" step="5"></label>
    <label>Box opacity <input type="range" id="cAlpha" min="30" max="100"></label>
    <label>Text <input type="color" id="cFg"></label>
    <label>Muted text <input type="color" id="cMut"></label>
    <button id="cReset">Reset colors</button>
  </div>
  <label>Wallpaper <span><input type="file" id="wallFile" accept="image/*"> <button id="wallClear">Remove</button></span></label>
  <label>Twitch <button id="twBtn"></button></label>
  <div><b>Hidden items</b><div id="hiddenList" class="mut"></div></div>
</aside>
<div id="upd" hidden>A new version is available <button id="updBtn">Reload</button></div>
<div id="modal" hidden><div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="ph"><b id="mTitle"></b><button id="mClose">Close</button></div><div id="mBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body></html>
