<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Start page</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<div id="wall"></div>
<aside id="dock" hidden aria-label="Docked players"></aside>
<div id="dockGrip" title="Drag to resize the players"></div>
<main id="app">
  <header>
    <div><div id="day">Day</div><div id="date" class="mut">Date</div></div>
    <div class="acts">
      <div class="dd">
        <button id="clockBtn" class="ib" aria-label="Timer, countdown, stopwatch" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
        <div class="menu" id="clockMenu" role="menu" hidden>
          <button role="menuitem" data-a="clockmenu" data-k="t">Timer</button>
          <button role="menuitem" data-a="clockmenu" data-k="c">Countdown</button>
          <button role="menuitem" data-a="clockmenu" data-k="s">Stopwatch</button>
        </div>
      </div>
      <button id="notesBtn" class="ib" aria-label="Notes"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span id="notesN"></span></button>
      <div class="dd">
        <button id="cogBtn" class="ib" aria-label="Edit and settings" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
        <div class="menu" id="cogMenu" role="menu" hidden>
          <button role="menuitem" id="editBtn">Edit</button>
          <button role="menuitem" id="setBtn">Settings</button>
        </div>
      </div>
    </div>
  </header>
  <div id="clocks"></div>
  <div id="grid"></div>
  <footer class="mut">Start page · version <span id="ver"></span> · weather, Twitch and stock prices are live once connected; other tiles are sample data<span id="who"></span></footer>
</main>
<aside id="panel" hidden>
  <div class="ph"><b>Settings</b><button id="closeBtn">Close</button></div>
  <div class="acct">
    <b>Account</b>
    <div id="acctOut">
      <input id="email" type="email" placeholder="Email" autocomplete="email">
      <input id="pass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
      <div class="acts"><button id="signIn">Sign in</button><button id="signUp">Create account</button></div>
    </div>
    <div id="acctIn" hidden><span id="acctMail"></span><button id="signOut">Sign out</button></div>
    <div id="acctMsg" class="mut" role="status"></div>
  </div>
  <div class="acct">
    <b>Gmail accounts</b>
    <input type="text" id="mn0" placeholder="Name, e.g. Personal">
    <input type="text" id="mu0" placeholder="Script address (ends in /exec)">
    <input type="text" id="mt0" placeholder="Token">
    <input type="text" id="mn1" placeholder="Name, e.g. Work">
    <input type="text" id="mu1" placeholder="Script address (ends in /exec)">
    <input type="text" id="mt1" placeholder="Token">
    <button id="mailSave">Save Gmail accounts</button>
    <div id="mailMsg" class="mut" role="status"></div>
  </div>
  <div class="acct">
    <b>News sources</b>
    <div id="srcNews"></div>
    <form id="addNews" class="add"><input type="text" id="newsName" placeholder="Name (optional)"><input type="text" id="newsUrl" placeholder="Feed address or website"><button>Add</button></form>
    <b>Telegram channels</b>
    <div id="srcTg"></div>
    <form id="addTg" class="add"><input type="text" id="tgIn" placeholder="Channel name or t.me link"><button>Add</button></form>
    <button id="srcReset">Back to default sources</button>
    <div id="srcMsg" class="mut" role="status"></div>
  </div>
  <label>Theme <button id="themeBtn"></button></label>
  <label>Accent color <span><input type="color" id="accent"> <button id="accentReset">Reset</button></span></label>
  <div class="acct">
    <b>Colors</b>
    <label>Background <input type="color" id="cBg"></label>
    <label>Boxes <input type="color" id="cCard"></label>
    <label>Text size <input type="range" id="fsAll" min="70" max="140" step="5"></label>
    <label>Box opacity <input type="range" id="cAlpha" min="30" max="100"></label>
    <label>Text <input type="color" id="cFg"></label>
    <label>Muted text <input type="color" id="cMut"></label>
    <button id="cReset">Reset colors</button>
  </div>
  <label>Wallpaper <span><input type="file" id="wallFile" accept="image/*"> <button id="wallClear">Remove</button></span></label>
  <label>Twitch <button id="twBtn"></button></label>
  <div><b>Hidden items</b><div id="hiddenList" class="mut"></div></div>
</aside>
<div id="upd" hidden>A new version is available <button id="updBtn">Reload</button></div>
<div id="modal" hidden><div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="ph"><b id="mTitle"></b><button id="mClose">Close</button></div><div id="mBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body></html>
